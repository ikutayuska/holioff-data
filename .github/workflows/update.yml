name: Update holiday data

on:
  schedule:
    # 03:00 UTC on the 1st of every month.
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      years:
        description: "Year range to generate, e.g. 2025-2028 (default: last year through two years ahead)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the latest holidays library
        run: pip install --upgrade -r requirements.txt

      - name: Regenerate v1/ when the holidays changed
        run: python3 tools/publish.py --years "${{ inputs.years }}"

      - name: Commit and push
        run: |
          git add v1
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          VERSION=$(pip show holidays | sed -n 's/^Version: //p')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update holiday data (holidays $VERSION)"
          git push
